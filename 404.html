<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XPRS</title>
<link rel="icon" href="/favicon.svg">
<!-- The portal's logo font (portal/page/logo-font.css, copied by tool/sync_in.sh). -->
<link rel="stylesheet" href="/in/logo-font.css">
<style>
/* The page shown while a station is looked for. It wears the portal's look
   (portal/page/chat_page.html: the palette on :root, .header, .card, .act),
   so the portal that replaces it changes the content, not the design. */
:root{--accent:#ffa86a;--bg:#0a0a0b;--text:#f2f0ee;--border:rgba(255,168,106,.2);--muted:#8f8a86;
      --panel:#141312;--line:#232120;--dim:#6b6560;--on-accent:#140c06;--accent-soft:rgba(255,168,106,.14);
      --hover:rgba(255,168,106,.08);--bad:#ff6b6b;--radius:14px;
      --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);
     font-size:14px;display:flex;flex-direction:column}
.header{border-bottom:1px solid var(--border);height:40px;padding:0 12px;margin-top:calc(5px + var(--sat));
        display:flex;align-items:center;gap:12px;flex:none}
.header .logo{font-family:'Wartext',sans-serif;font-size:38px;color:var(--accent);letter-spacing:5px;
        margin-top:-12px;transform:scaleY(.72);transform-origin:center;text-decoration:none}
.header .stcall{color:var(--muted);font-size:13px;letter-spacing:1px;margin-left:-6px;white-space:nowrap}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:16px 12px calc(16px + var(--sab))}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
      padding:22px 20px 18px;width:100%;max-width:380px;text-align:center}
#in-call{font-size:24px;font-weight:bold;letter-spacing:2px;color:var(--accent);overflow-wrap:anywhere}
#in-kind{font-size:12px;color:var(--dim);margin-top:2px;min-height:15px}
/* Where the way to the station is: one segment per leg, lit as it is done. */
#in-steps{display:flex;gap:4px;margin:18px 0 6px}
#in-steps i{flex:1;height:3px;border-radius:2px;background:var(--line);transition:background .3s}
#in-steps i.done{background:var(--accent)}
#in-steps i.on{background:var(--accent);animation:look 1.4s ease-in-out infinite}
#in-steps.bad i.on{background:var(--bad);animation:none}
#in-legs{display:flex;gap:4px;font-size:10px;color:var(--dim);letter-spacing:.3px}
#in-legs span{flex:1}
#in-status{color:var(--muted);font-size:13px;margin-top:16px;min-height:19px;animation:look 1.4s ease-in-out infinite}
#in-status.bad{color:var(--bad);animation:none}
#in-status.still{animation:none}
@keyframes look{50%{opacity:.35}}
#in-acts{display:none;gap:8px;justify-content:center;margin-top:16px}
#in-acts.show{display:flex}
.act{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:8px 14px;border-radius:8px;
     cursor:pointer;font:inherit;font-size:13px;min-height:36px;white-space:nowrap;line-height:1;
     text-decoration:none;display:inline-flex;align-items:center}
.act:hover{background:var(--accent-soft)}
.act.primary{background:var(--accent);color:var(--on-accent);font-weight:bold}
.act.quiet{border-color:var(--border);color:var(--muted)}
.act.quiet:hover{color:var(--text);background:var(--hover)}
details{margin-top:14px;text-align:left;font-size:11px;color:var(--dim)}
details:not(.some){display:none}
summary{cursor:pointer;text-align:center;list-style:none}
summary::-webkit-details-marker{display:none}
#in-log{margin-top:8px;border-top:1px solid var(--line);padding-top:8px;max-height:30vh;overflow:auto}
#in-log div{margin:2px 0;overflow-wrap:anywhere}
#in-log div.bad{color:var(--bad)}
a{color:var(--accent)}
</style>
</head>
<body>
<div class="header"><a class="logo" href="/in/" title="Stations">XPRS</a><span class="stcall" id="in-head"></span></div>
<main>
<div class="card">
  <div id="in-call"></div>
  <div id="in-kind"></div>
  <div id="in-steps"><i></i><i></i><i></i><i></i><i></i></div>
  <div id="in-legs"><span>Gateway</span><span>Station</span><span>Link</span><span>Proof</span><span>Portal</span></div>
  <div id="in-status"></div>
  <div id="in-acts"><button class="act primary" onclick="location.reload()">Try again</button><a class="act quiet" href="/in/">Stations</a></div>
  <details id="in-more"><summary>Details</summary><div id="in-log"></div></details>
  <noscript>This page needs JavaScript.</noscript>
</div>
</main>
<script>
/* xprs.dev/in/<callsign> opens that station's portal over Reticulum
 * (/in/shell.js). Any other unknown address is a plain "not here". */
(function(){
  var m=/^\/in\/([a-z0-9-]+)\/?$/i.exec(location.pathname)||
        /^\/in\/g\/([a-z0-9][a-z0-9_-]{0,15})\/?$/i.exec(location.pathname);
  var st=document.getElementById('in-status');
  if(!m){
    document.getElementById('in-call').textContent='404';
    document.getElementById('in-steps').style.display=document.getElementById('in-legs').style.display='none';
    st.className='still';st.innerHTML='Nothing here. <a href="/">xprs.dev</a>';
    return;
  }
  var grp=/^\/in\/g\//i.test(location.pathname)||/^x5/i.test(m[1]),name=m[1].toUpperCase();
  document.getElementById('in-call').textContent=name;
  document.getElementById('in-head').textContent=name;
  document.getElementById('in-kind').textContent=grp?'Group':'Station';
  st.textContent='Looking for '+name+'…';
  var s=document.createElement('script');s.src='/in/shell.js';document.body.appendChild(s);
})();
</script>
</body>
</html>
