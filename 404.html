<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XPRS</title>
<link rel="icon" href="/favicon.svg">
<style>
:root{--bg:#0a0a0b;--text:#f2f0ee;--muted:#8f8a86;--accent:#ffa86a;--bad:#ff6b6b}
@media (prefers-color-scheme: light){:root{--bg:#fafaf7;--text:#1f2328;--muted:#6b7280;--accent:#c2581d;--bad:#c62828}}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:12vh auto;padding:0 16px}
h1{font-size:22px;letter-spacing:4px;color:var(--accent);margin:0 0 4px}
#in-call{font-size:15px;color:var(--muted);margin:0 0 18px}
#in-status div{color:var(--muted);margin:4px 0}
#in-status div.bad{color:var(--bad)}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
<h1>XPRS</h1>
<p id="in-call"></p>
<div id="in-status"></div>
<noscript>This page needs JavaScript.</noscript>
</main>
<script>
/* xprs.dev/in/<callsign> opens that station's portal over Reticulum
 * (/in/shell.js). Any other unknown address is a plain "not here". */
(function(){
  var m=/^\/in\/([a-z0-9-]+)\/?$/i.exec(location.pathname);
  if(!m){
    document.getElementById('in-status').innerHTML='<div>Nothing here. <a href="/">xprs.dev</a></div>';
    return;
  }
  document.getElementById('in-call').textContent='Reaching station '+m[1].toUpperCase()+' over Reticulum';
  var s=document.createElement('script');s.src='/in/shell.js';document.body.appendChild(s);
})();
</script>
</body>
</html>
