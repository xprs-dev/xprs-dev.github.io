<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XPRS stations</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#0a0a0b;--panel:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#ffa86a;--bad:#ff6b6b}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--border)}
h1{font-size:18px;letter-spacing:4px;color:var(--accent);margin:0}
#count{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#count.bad{color:var(--bad)}
nav{display:flex;gap:2px;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:2px;flex:none}
nav a{color:var(--muted);text-decoration:none;padding:4px 10px;border-radius:4px}
nav a.on{background:#21262d;color:var(--text)}
form{margin-left:auto;flex:none}
#go{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 10px;width:130px;font:inherit;text-transform:uppercase}
#go::placeholder{text-transform:none;color:var(--muted)}
main{flex:1;display:flex;min-height:0}
#map{flex:1;background:#1f1f1f}
#side{width:260px;overflow:auto;border-left:1px solid var(--border)}
#side:empty{display:none}
#list{flex:1;overflow:auto;display:none}
body.listing #list{display:block}
body.listing #map,body.listing #side{display:none}
#list .st{max-width:720px;margin:0 auto;align-items:center}
#list .st div{min-width:0;display:flex;gap:10px;align-items:baseline}
#list .st em{font-style:normal;color:#43A047;font-size:12px}
#list p{color:var(--muted);text-align:center;padding:16px}
#list button{display:block;margin:12px auto 24px;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 14px;font:inherit;cursor:pointer}
.st{display:flex;justify-content:space-between;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border);color:var(--text);text-decoration:none}
.st:hover{background:var(--panel)}
.st b{color:var(--accent);font-weight:600}
.st span{color:var(--muted);font-size:13px;white-space:nowrap}
.st i{font-style:normal;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leaflet-container{background:#1f1f1f;font:inherit}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--text);border:1px solid var(--border);box-shadow:none}
.leaflet-popup-content a{color:var(--accent);font-weight:600}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.leaflet-control-zoom a{background:var(--panel);color:var(--text);border-color:var(--border)}
.leaflet-control-zoom a:hover{background:#21262d}
.leaflet-control-attribution{background:rgba(22,27,34,.8)!important;color:var(--muted)}
.leaflet-control-attribution a{color:#7fb0e0}
@media (max-width:720px){main{flex-direction:column}#map{min-height:60vh}#side{width:auto;border-left:0;border-top:1px solid var(--border)}header{gap:10px;padding:10px 12px}h1{font-size:15px;letter-spacing:2px}#count{font-size:13px}#go{width:80px;padding:6px 8px}nav a{padding:4px 8px}#count{display:none}.leaflet-control-attribution{font-size:10px}}
</style>
</head>
<body>
<header><h1>XPRS</h1><nav><a href="#" id="tab-map" class="on">Map</a><a href="#list" id="tab-list">List</a></nav><span id="count">Connecting…</span>
<form id="goform"><input id="go" placeholder="Callsign" autocomplete="off" spellcheck="false"></form></header>
<main><div id="map"></div><div id="side"></div><div id="list"></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* xprs.dev/in/: stations on a map. Reached over Reticulum through a gateway
 * (gateways.json), whose station's public history gives the identities it
 * heard; a station is placed by the newest pos:/acc: in them (XPRS.md 6.3.2,
 * 15.1). Only stations heard in the last RECENT seconds are counted. */
(function () {
  'use strict';
  var RECENT = 86400;
  var countEl = document.getElementById('count');
  function say(t, bad) { countEl.textContent = t; countEl.className = bad ? 'bad' : ''; }
  var stations = [], shown = 50;
  function view() {
    var listing = location.hash === '#list';
    document.body.classList.toggle('listing', listing);
    document.getElementById('tab-map').classList.toggle('on', !listing);
    document.getElementById('tab-list').classList.toggle('on', listing);
    document.getElementById('go').placeholder = listing ? 'Filter' : 'Callsign';
    if (listing) drawList(); else map.invalidateSize();
  }
  window.addEventListener('hashchange', view);
  document.getElementById('go').oninput = function () { shown = 50; if (location.hash === '#list') drawList(); };
  function drawList() {
    var box = document.getElementById('list'), q = document.getElementById('go').value.trim().toLowerCase();
    var hits = stations.filter(function (s) {
      return !q || s.call.toLowerCase().indexOf(q) >= 0 || s.nick.toLowerCase().indexOf(q) >= 0;
    });
    box.innerHTML = '';
    if (!stations.length) { box.innerHTML = '<p>Connecting…</p>'; return; }
    if (!hits.length) { box.innerHTML = '<p>No station matches.</p>'; return; }
    hits.slice(0, shown).forEach(function (s) {
      var a = document.createElement('a');
      a.className = 'st'; a.href = '/in/' + s.call.toLowerCase();
      a.innerHTML = '<div><b>' + esc(s.call) + '</b><i>' + esc(s.nick) + '</i>' + (s.pos ? '<em>●</em>' : '') +
        '</div><span>' + ago(s.last) + '</span>';
      box.appendChild(a);
    });
    if (hits.length > shown) {
      var more = document.createElement('button');
      more.textContent = 'Show ' + Math.min(50, hits.length - shown) + ' more of ' + (hits.length - shown);
      more.onclick = function () { shown += 50; drawList(); };
      box.appendChild(more);
    }
  }
  document.getElementById('goform').onsubmit = function (e) {
    e.preventDefault();
    var c = document.getElementById('go').value.trim().toLowerCase();
    if (/^[a-z0-9]{3,8}(-[0-9]{1,2})?$/.test(c)) location.href = '/in/' + c;
  };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function load(src) { return new Promise(function (ok, no) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = function () { no(new Error('could not load ' + src)); }; document.head.appendChild(s); }); }
  function nonce() { var a = new Uint8Array(12); crypto.getRandomValues(a); return Array.prototype.map.call(a, function (x) { return ('0' + x.toString(16)).slice(-2); }).join(''); }

  var map = L.map('map', { worldCopyJump: true }).setView([30, 0], 2);
  map.attributionControl.setPrefix(false);

  // OpenStreetMap tiles repainted in the Protomaps "dark" palette, the same
  // recolouring as the app's map `tile-style: dark` (app/lib/wapp/geoui/
  // tile_recolor.dart, which the check-in app uses): near-black land,
  // blue-grey water, dark green parks, grey roads, light grey labels.
  var WATER = 0x31353f, PARK = 0x1c2421, SAND = 0x212123, MAJOR = 0x474747, BOUNDARY = 0x5b6374;
  var RAMP = [[0, 175], [110, 120], [185, 24], [212, 17], [236, 31], [244, 31], [255, 61]];
  var LUM = new Uint8Array(256);
  for (var l = 0; l < 256; l++) {
    var v = RAMP[RAMP.length - 1][1];
    for (var i = 0; i + 1 < RAMP.length; i++) {
      var a = RAMP[i], b = RAMP[i + 1];
      if (l <= b[0]) { v = a[1] + (b[1] - a[1]) * (l - a[0]) / (b[0] - a[0]); break; }
    }
    LUM[l] = Math.round(v);
  }
  function recolorDark(d) {
    for (var i = 0; i + 3 < d.length; i += 4) {
      var r = d[i], g = d[i + 1], b = d[i + 2];
      var l = ((299 * r + 587 * g + 114 * b) / 1000) | 0, grey = LUM[l];
      var mx = Math.max(r, g, b), mn = Math.min(r, g, b), chroma = mx - mn;
      if (chroma < 14) { d[i] = d[i + 1] = d[i + 2] = grey; continue; }
      var target;
      if (b >= g - 8 && b > r + 15 && g > r) {
        if (l < 150) { d[i] = d[i + 1] = d[i + 2] = grey; continue; }
        target = WATER;
      } else if (g > r + 6 && g >= b) target = PARK;
      else if (r > b + 20 && l > 215 && chroma < 56 && r - g < 20) target = SAND;
      else if (r > b + 20 && (g > b + 10 || r > g + 20)) target = MAJOR;
      else target = BOUNDARY;
      var t = chroma >= 44 ? 30 : chroma - 14;
      d[i] = grey + ((((target >> 16) - grey) * t / 30) | 0);
      d[i + 1] = grey + (((((target >> 8) & 0xff) - grey) * t / 30) | 0);
      d[i + 2] = grey + ((((target & 0xff) - grey) * t / 30) | 0);
    }
  }
  var DarkTiles = L.GridLayer.extend({
    createTile: function (c, done) {
      var cv = document.createElement('canvas'), sz = this.getTileSize();
      cv.width = sz.x; cv.height = sz.y;
      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function () {
        var g = cv.getContext('2d');
        g.drawImage(img, 0, 0, sz.x, sz.y);
        try { var px = g.getImageData(0, 0, sz.x, sz.y); recolorDark(px.data); g.putImageData(px, 0, 0); } catch (e) {}
        done(null, cv);
      };
      img.onerror = function () { done(new Error('tile'), cv); };
      img.src = 'https://' + 'abc'[(c.x + c.y) % 3] + '.tile.openstreetmap.org/' + c.z + '/' + c.x + '/' + c.y + '.png';
      return cv;
    }
  });
  new DarkTiles({ maxZoom: 18, attribution: '&copy; OpenStreetMap' }).addTo(map);

  // A wire's field (`m:` is the rest of the line).
  function field(w, k) {
    var head = w.indexOf(' m:') >= 0 ? w.slice(0, w.indexOf(' m:')) : w;
    var parts = head.split(' ');
    for (var i = 0; i < parts.length; i++) if (parts[i].indexOf(k + ':') === 0) return parts[i].slice(k.length + 1);
    return null;
  }
  function base(c) { return String(c || '').toUpperCase().split('-')[0]; }
  // pos: as XPRS.md 15.1 has it: redaction bars dropped, precision from decimals.
  function parsePos(p) {
    if (!p) return null;
    p = p.replace(/█/g, '');
    var m = /^(-?\d+(?:\.(\d*))?),(-?\d+(?:\.(\d*))?)$/.exec(p);
    if (!m) return null;
    var lat = parseFloat(m[1]), lon = parseFloat(m[3]);
    if (!(lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180)) return null;
    var dec = Math.min((m[2] || '').length, (m[4] || '').length);
    return { lat: lat, lon: lon, metres: [111000, 11100, 1110, 111, 11, 1.1][Math.min(dec, 5)] };
  }
  function accMetres(a) {
    var m = /^(\d+(?:\.\d+)?)(m|km)?$/.exec(a || '');
    return m ? parseFloat(m[1]) * (m[2] === 'km' ? 1000 : 1) : 0;
  }
  function ago(ts) {
    var s = Math.max(0, Date.now() / 1000 - ts);
    return s < 120 ? 'just now' : s < 7200 ? Math.round(s / 60) + ' min ago' : s < 172800 ? Math.round(s / 3600) + ' h ago' : Math.round(s / 86400) + ' d ago';
  }

  function render(rows) {
    var st = {}, now = Date.now() / 1000;
    rows.forEach(function (r) {
      var w = r.wire || '', c = base(field(w, 'f'));
      // XPRS stations only: other networks' nodes (MT…, MC…) and radio
      // callsigns are heard here but cannot be opened over Reticulum.
      if (!/^X[1-5][A-Z0-9]{2,6}$/.test(c)) return;
      var s = st[c] || (st[c] = { call: c, last: 0, nick: '', pos: null, posTs: 0 });
      if (r.ts > s.last) s.last = r.ts;
      var t = field(w, 't');
      if (t === 'identity') { var n = field(w, 'nick'); if (n && n !== '-' && !s.nick) s.nick = n; }
      var pf = (t === 'identity' || t === 'service') ? field(w, 'pos') : null;
      if (pf !== null && r.ts >= s.posTs) {
        var p = pf === '-' ? null : parsePos(pf);
        if (p) p.metres = Math.max(p.metres, accMetres(field(w, 'acc')));
        if (p || pf === '-') { s.pos = p; s.posTs = r.ts; }
      }
    });
    var all = Object.keys(st).map(function (k) { return st[k]; });
    var recent = all.filter(function (s) { return now - s.last < RECENT; }).length;
    var placed = all.filter(function (s) { return s.pos; }).sort(function (a, b) { return b.last - a.last; });
    stations = all.sort(function (a, b) { return b.last - a.last; });
    if (location.hash === '#list') drawList();
    var side = document.getElementById('side'), bounds = L.latLngBounds([]);
    side.innerHTML = '';
    placed.forEach(function (s) {
      var href = '/in/' + s.call.toLowerCase(), ll = [s.pos.lat, s.pos.lon];
      var a = document.createElement('a');
      a.className = 'st'; a.href = href;
      a.innerHTML = '<div><b>' + esc(s.call) + '</b><br><i>' + esc(s.nick) + '</i></div><span>' + ago(s.last) + '</span>';
      side.appendChild(a);
      var pop = '<a href="' + href + '">' + esc(s.call) + '</a>' + (s.nick ? ' ' + esc(s.nick) : '') + '<br>' + ago(s.last);
      if (s.pos.metres >= 20000) {
        var ring = L.circle(ll, { radius: s.pos.metres, color: '#FFC107', weight: 1, fillOpacity: .07 }).addTo(map).bindPopup(pop);
        bounds.extend(ring.getBounds());
      }
      L.circleMarker(ll, { radius: 7, color: '#A5D6A7', fillColor: '#43A047', fillOpacity: .95, weight: 2 }).addTo(map).bindPopup(pop);
      bounds.extend(ll);
    });
    if (bounds.isValid()) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 10 });
    say(placed.length + ' mapped \u00b7 ' + recent + ' heard today');
  }

  function history(kind) {
    var q = { limit: '200' };
    if (kind) q.kind = kind;
    return window.XprsRns.api('GET', '/api/xprs/history', JSON.stringify(q), null).then(function (r) {
      if (r.status !== 200) return [];
      try { return JSON.parse(new TextDecoder().decode(r.body)).rows || []; } catch (e) { return []; }
    });
  }

  function viaGateway(gws, i) {
    if (i >= gws.length) return Promise.reject(new Error('no gateway answered'));
    var g = gws[i], station;
    return window.XprsRns.connect(g).then(function (hello) {
      station = (JSON.parse(hello).station || '').toUpperCase();
      if (!station) throw new Error(g + ' names no station');
      return window.XprsRns.resolve(station);
    }).then(function (j) {
      var r = JSON.parse(j);
      if (!r.rns) throw new Error(g + ' gave no key for ' + station);
      return window.XprsRns.open(r.rns);
    }).then(function (ok) {
      if (!ok) throw new Error('no link to ' + station);
      var n = nonce();
      return window.XprsRns.prove(n).then(function (p) { return JSON.parse(window.XprsRns.verify(p, station, n)); });
    }).then(function (v) {
      if (!v.ok) throw new Error('This is not ' + station + ': ' + v.why);
      return station;
    }).catch(function (e) {
      return viaGateway(gws, i + 1);
    });
  }

  load('/in/rns.js').then(function () {
    return fetch('/in/gateways.json', { cache: 'no-cache' }).then(function (r) { return r.json(); });
  }).then(function (j) {
    return viaGateway(j.gateways || [], 0);
  }).then(function (station) {
    return history('identity,service,observation').then(function (a) {
      return history('').then(function (b) { render(a.concat(b)); });
    });
  }).catch(function () { say('Can\u2019t reach the network right now', true); });
  view();
})();
</script>
</body>
</html>
